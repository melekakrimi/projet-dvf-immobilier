version: 2

models:
  - name: fct_ventes
    description: "Table de faits. Grain : une ligne = une vente d'un seul logement (maison ou appartement)."
    columns:
      - name: vente_id
        tests: [unique, not_null]
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: zone_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_zone')
              field: zone_key
      - name: type_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_type_bien')
              field: type_key
      - name: nature_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_nature_vente')
              field: nature_key

  - name: dim_date
    description: "Un jour par ligne, de 2023 a 2025"
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_zone
    description: "Une commune par ligne, hierarchie aplatie (commune, departement, pays)"
    columns:
      - name: zone_key
        tests: [unique, not_null]

  - name: dim_type_bien
    columns:
      - name: type_key
        tests: [unique, not_null]
      - name: type_bien
        tests:
          - accepted_values:
              values: ['Maison', 'Appartement']

  - name: dim_nature_vente
    columns:
      - name: nature_key
        tests: [unique, not_null]